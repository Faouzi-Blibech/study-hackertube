name: Transcripts

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max new videos to fetch transcripts for"
        default: "200"
  # workflow_dispatch only appears once this file is on the default branch; until then a push to
  # dev that touches this file starts a run.
  push:
    branches: [dev]
    paths: [".github/workflows/transcripts.yml"]

permissions:
  contents: write

jobs:
  transcripts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Restore transcript cache
        uses: actions/cache@v4
        with:
          path: data/transcripts
          key: transcripts-${{ github.run_id }}
          restore-keys: |
            transcripts-

      - name: Fetch transcripts
        run: |
          set +e
          python scripts/fetch_transcripts.py --limit "${{ inputs.limit || '200' }}"
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "::warning::YouTube blocked this IP (likely cloud IP); continuing with cached transcripts"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Build segments
        run: python scripts/build_segments.py

      - name: Commit segments
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/segments
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update transcript segments"
            git push
          fi
